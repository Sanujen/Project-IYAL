services:
  server:
    image: sathveegan/iyal-input-normalizer-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - ${SERVER_PORT:-8000}:${SERVER_PORT:-8000}
    command: fastapi dev --host 0.0.0.0 --port ${SERVER_PORT:-8000} --reload ./server/server.py
    networks:
      - app-network

  ui:
    image: sathveegan/iyal-input-normalizer-ui:latest
    build:
      context: ./ui
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - BASE_API_URL=http://server:${SERVER_PORT:-8000}
    ports:
      - ${UI_PORT:-8501}:${UI_PORT:-8501}
    command: streamlit run main.py --server.port ${UI_PORT:-8501} --server.address 0.0.0.0
    networks:
      - app-network
    depends_on:
      - server
  docs:
    image: sathveegan/iyal-input-normalizer-docs:latest
    build:
      context: ./docs
      dockerfile: Dockerfile
    ports:
      - "${DOCS_PORT:-80}:${DOCS_PORT:-80}"
    restart: unless-stopped 

networks:
  app-network:
    driver: bridge 