services:
  iyal-monolith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iyal-monolith
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT:-8000}
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - HF_HOME=/app/model_cache
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./model_cache:/app/model_cache
    networks:
      - iyal-network

networks:
  iyal-network:
    driver: bridge
