services:
  iyal-monolith:
    image: sathveegan/project-iyal:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iyal-monolith
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=${SERVER_PORT:-8000}
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - HF_HOME=/app/model_cache
      - HF_HUB_DISABLE_XET=1
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - HF_TOKEN=${HF_TOKEN:-}
      - RESEARCHGATE_PAPER_URL=${RESEARCHGATE_PAPER_URL:-https://www.researchgate.net/publication/397403935_IYAL_Input_Text_Normalizer_for_Tamil_Language}
      - GITHUB_REPO_URL=${GITHUB_REPO_URL:-https://github.com/Sanujen/Project-IYAL}
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./model_cache:/app/model_cache
    networks:
      - iyal-network

networks:
  iyal-network:
    driver: bridge
